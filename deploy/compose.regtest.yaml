# Regtest overlay for development and CI (SPEC §2.3.9). Use through `just`:
#   just up                     # ALICE_CHAIN=bundled by default
#   just up chain=electrum
# or directly:
#   docker compose -f compose.yaml -f compose.regtest.yaml --env-file regtest.env up -d
#
# "ldk-server" is Alice, the node Allod manages. Bob and Carol are counterparties:
# Alice -> Bob -> Carol -> Alice channel ring. All three run the same image, which is
# built once by the `ldk-server` service (build context: deploy/compose.yaml); this
# overlay only pulls it, so the ldk-server pin is never restated here.

name: allod-regtest

x-regtest-ldk-env: &regtest-ldk-env
  LDK_NETWORK: regtest
  LDK_CHAIN: bundled
  LDK_BITCOIND_RPC_ADDRESS: bitcoind:8332
  LDK_BITCOIND_RPC_USER: ldk
  LDK_BITCOIND_RPC_PASS: ldk-regtest
  LDK_LISTEN: 0.0.0.0:9735
  LDK_ANCHOR_PER_CHANNEL_RESERVE_SATS: "0"
  LDK_GRPC_ADDRESS: 0.0.0.0:3536
  LDK_GOSSIP: p2p
  LDK_SEED_HANDOFF: "false"
  LDK_LOG_LEVEL: Info
  # No LSPS2 LSP on regtest: the mainnet default is unreachable there.
  LDK_LSPS2_LSP: ""
  LDK_LSPS2_LSP_TOKEN: ""
  # Readable by the host user for `just run` (regtest only).
  LDK_CREDENTIALS_MODE: "0444"

# Allod and the tools image share one build stage: same profile for both, or it is built
# twice. fast-release skips LTO, so a code change relinks in seconds (Cargo.toml).
x-fast-build-args: &fast-build-args
  CARGO_PROFILE: fast-release

services:
  bitcoind:
    profiles: !reset []
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_PRUNE: "0"
      BITCOIN_TXINDEX: "1"
      BITCOIN_REST: "1"
      BITCOIN_DISABLE_WALLET: "0"
    ports:
      - "127.0.0.1:18443:8332"

  # Regtest nodes gossip with each other directly; the mainnet sidecar is not started.
  gossip:
    profiles: !override [sidecar]

  ldk-server:
    depends_on:
      electrs: { condition: service_started }
    # Rootless Docker maps container root to the host user, so files the host writes into
    # the shared handoff dir (the phrase from `just run`, mode 0400) look root-owned here.
    # Container root can read them; uid 1000 cannot. Harmless: root inside rootless is the
    # host user outside. Regtest only.
    user: "0:0"
    environment:
      LDK_NETWORK: regtest
      LDK_CHAIN: ${ALICE_CHAIN:-bundled}
      LDK_ELECTRUM_URL: tcp://electrs:50001
      LDK_ESPLORA_URL: http://electrs:3002
      LDK_ALIAS: alice
      LDK_TLS_HOSTS: ldk-server,localhost
      LDK_GOSSIP: p2p
      LDK_LSPS2_LSP: ""
      LDK_LSPS2_LSP_TOKEN: ""
      LDK_CREDENTIALS_DIRS: /handoff /dev-secrets/alice
      LDK_CREDENTIALS_MODE: "0444"
    ports: !override
      - "127.0.0.1:3536:3536"
    volumes:
      # Handoff on the host too, so `just run` (Allod on the host) can hand Alice
      # the recovery phrase and pick up her TLS cert and macaroon (SPEC §2.3.9).
      - ./.dev/handoff:/handoff
      - ./.dev:/dev-secrets

  ldk-bob:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-ldk-server:${ALLOD_VERSION:-dev}
    restart: unless-stopped
    sysctls: &ldk-sysctls
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "10240 65000"
    depends_on:
      bitcoind: { condition: service_healthy }
    environment:
      <<: *regtest-ldk-env
      LDK_ALIAS: bob
      LDK_TLS_HOSTS: ldk-bob,localhost
      LDK_CREDENTIALS_DIRS: /dev-secrets/bob
    ports:
      - "127.0.0.1:3537:3536"
    volumes:
      - bob-data:/data
      - ./.dev:/dev-secrets

  ldk-carol:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-ldk-server:${ALLOD_VERSION:-dev}
    restart: unless-stopped
    sysctls: *ldk-sysctls
    depends_on:
      bitcoind: { condition: service_healthy }
    environment:
      <<: *regtest-ldk-env
      LDK_ALIAS: carol
      LDK_TLS_HOSTS: ldk-carol,localhost
      LDK_CREDENTIALS_DIRS: /dev-secrets/carol
    ports:
      - "127.0.0.1:3538:3536"
    volumes:
      - carol-data:/data
      - ./.dev:/dev-secrets

  electrs:
    profiles: !reset []
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:8332
      - --cookie=ldk:ldk-regtest
      - --jsonrpc-import
      - --db-dir=/data
      - --electrum-rpc-addr=0.0.0.0:50001
      - --http-addr=0.0.0.0:3002
    ports:
      - "127.0.0.1:50001:50001"
      - "127.0.0.1:3002:3002"

  relay:
    image: scsibug/nostr-rs-relay:0.10.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:8080"

  relay2:
    image: scsibug/nostr-rs-relay:0.10.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:8080"

  bootstrap:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-tools:${ALLOD_VERSION:-dev}
    build: &build-tools
      context: ..
      dockerfile: images/allod.Dockerfile
      target: tools
      args: *fast-build-args
      additional_contexts:
        ldk: service:ldk-server
        btc: service:bitcoind
    depends_on:
      bitcoind: { condition: service_healthy }
    environment: &tools-env
      BITCOIND_RPC_URL: http://bitcoind:8332
      BITCOIND_RPC_USER: ldk
      BITCOIND_RPC_PASS: ldk-regtest
      ALICE_CHAIN: ${ALICE_CHAIN:-bundled}
      ALLOD_DEV_OWNER_PUBKEY: ${ALLOD_DEV_OWNER_PUBKEY:-}
    command: ["bash", "/usr/local/share/allod/bootstrap.sh"]
    volumes:
      - ./.dev:/dev-secrets
      # Scripts from the working tree, so editing bootstrap.sh needs no image rebuild.
      - ./scripts:/usr/local/share/allod:ro

  miner:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-tools:${ALLOD_VERSION:-dev}
    build: *build-tools
    restart: unless-stopped
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    environment:
      <<: *tools-env
      MINE_INTERVAL: ${MINE_INTERVAL:-10}
    command: ["bash", "/usr/local/share/allod/miner.sh"]
    volumes:
      - ./scripts:/usr/local/share/allod:ro

  # One-off commands: `just doctor`, `just bob ...`.
  tools:
    profiles: [tools]
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-tools:${ALLOD_VERSION:-dev}
    build: *build-tools
    environment: *tools-env
    volumes:
      - ./.dev:/dev-secrets:ro

  # Allod starts first: dev auto-setup hands Alice's ldk-server its recovery phrase.
  allod:
    build:
      args: *fast-build-args
    depends_on:
      bitcoind: { condition: service_healthy }
    environment:
      ALLOD_NETWORK: regtest
      ALLOD_RELAYS: ws://relay:8080,ws://relay2:8080
      ALLOD_PROFILE_RELAYS: ws://relay:8080,ws://relay2:8080
      # Connection links name the relays as the host reaches them (published ports).
      ALLOD_CLIENT_RELAYS: ws://127.0.0.1:7000,ws://127.0.0.1:7001
      # No LSPS2 LSP on regtest.
      ALLOD_LSPS2_LSP: ""
      ALLOD_DEV_AUTO_SETUP: ${ALLOD_DEV_AUTO_SETUP:-true}
      ALLOD_DEV_OWNER_PUBKEY: ${ALLOD_DEV_OWNER_PUBKEY}
      ALLOD_LOG: info,allod=debug
      # Regtest keeps ldk-node's own P2P gossip (LDK_GOSSIP: p2p); the sidecar is off.
      ALLOD_GOSSIP_SIDECAR_URL: ""
    ports: !override
      - "127.0.0.1:18029:8029"
    volumes:
      # Same host-backed handoff as ldk-server, for `just up` and `just run` alike.
      - ./.dev/handoff:/handoff

volumes:
  bob-data:
  carol-data:
