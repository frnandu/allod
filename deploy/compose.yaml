# Allod full-node stack (SPEC §2.3). One file for VPS, Umbrel/StartOS wrappers and
# the regtest overlay (compose.regtest.yaml).
#
# Quick start (VPS):
#   cp .env.example .env   # then edit: network, chain mode, passwords, profiles
#   docker compose up -d
#   open http://127.0.0.1:8029 (SSH tunnel) or https://$ALLOD_DOMAIN with the https profile
#
# Profiles (COMPOSE_PROFILES in .env):
#   bundled   run bitcoind in this stack (ALLOD_CHAIN=bundled or bundled-rest)
#   https     Caddy with automatic Let's Encrypt for ALLOD_DOMAIN (and for own domains
#             served through a gateway; the gateway tunnel itself always runs)
#   tor       onion services for the web UI and Lightning P2P (the node's managed onion
#             is Settings -> Lightning -> Connectivity, served by tor-proxy, no profile)
#   backup    Litestream replication of the node and Allod databases
#   postgres  PostgreSQL for Allod and ldk-server
#
# ALLOD_CHAIN is the default chain source. Allod's Settings -> Bitcoin -> Chain source
# switches ldk-server to another Bitcoin Core node or an external Electrum/Esplora server
# (Alby, mempool.space, Blockstream or your own); this stack runs no Electrum server.

name: allod

x-build-ldk: &build-ldk
  context: ..
  dockerfile: images/ldk-server.Dockerfile

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  bitcoind:
    profiles: [bundled]
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod-bitcoind:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/bitcoind.Dockerfile }
    restart: unless-stopped
    stop_grace_period: 5m
    # Keep an unexpected bitcoind spike from consuming host RAM or swap.
    mem_limit: ${BITCOIN_MEMORY_LIMIT:-2g}
    memswap_limit: ${BITCOIN_MEMORY_LIMIT:-2g}
    logging: *logging
    environment:
      BITCOIN_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      BITCOIN_PRUNE: ${BITCOIN_PRUNE:-auto}
      BITCOIN_DBCACHE: ${BITCOIN_DBCACHE:-450}
      BITCOIN_SYNC_TUNING: ${BITCOIN_SYNC_TUNING:-auto}
      # Bundled bitcoind's RPC port; keep in sync with BITCOIND_RPC_ADDRESS below.
      BITCOIN_RPC_PORT: "${BITCOIN_RPC_PORT:-8332}"
      BITCOIN_RPC_USER: ${BITCOIND_RPC_USER:-ldk}
      BITCOIN_RPC_PASS: ${BITCOIND_RPC_PASS:?set BITCOIND_RPC_PASS in .env}
      BITCOIN_RO_RPC_USER: ${BITCOIND_RO_RPC_USER:-allod-ro}
      BITCOIN_RO_RPC_PASS: ${BITCOIND_RO_RPC_PASS:?set BITCOIND_RO_RPC_PASS in .env}
      BITCOIN_REST: ${BITCOIN_REST:-1}
      BITCOIN_TXINDEX: ${BITCOIN_TXINDEX:-0}
      BITCOIN_BLOCKFILTERINDEX: ${BITCOIN_BLOCKFILTERINDEX:-1}
      BITCOIN_DISABLE_WALLET: ${BITCOIN_DISABLE_WALLET:-1}
      BITCOIN_EXTRA_CONF: ${BITCOIN_EXTRA_CONF:-}
    volumes:
      - bitcoind-data:/data
      # Fast sync requests from the setup wizard (AssumeUTXO, optional).
      - bitcoind-control:/control

  # Local gossip sidecar (SPEC §2.3.2 rule 5): builds the graph from P2P gossip, checks
  # funding outputs against bitcoind's UTXO set, and serves it to ldk-server as Rapid
  # Gossip Sync snapshots (the default for LDK_GOSSIP=rgs).
  gossip:
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod-gossip:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/allod.Dockerfile, target: gossip }
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    # BOLT 10 seeds answer with SRV records, which many home routers and Tailscale
    # MagicDNS fail to resolve. Service names (bitcoind, tor-proxy) still resolve
    # through Docker's embedded DNS; only external lookups go to these servers.
    dns: [1.1.1.1, 8.8.8.8]
    depends_on:
      bitcoind: { condition: service_healthy, required: false }
      tor-proxy: { condition: service_started }
    environment:
      ALLOD_GOSSIP_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      # Peers are discovered: BOLT 10 DNS seeds on a first start, then the best-connected
      # nodes of the saved graph. ALLOD_GOSSIP_PEERS adds fixed pubkey@host:port peers.
      ALLOD_GOSSIP_PEERS: ${ALLOD_GOSSIP_PEERS:-}
      # Empty: the network's default seeds; "none" disables DNS seeding.
      ALLOD_GOSSIP_DNS_SEEDS: ${ALLOD_GOSSIP_DNS_SEEDS:-}
      ALLOD_GOSSIP_TARGET_PEERS: ${ALLOD_GOSSIP_TARGET_PEERS:-6}
      ALLOD_GOSSIP_TOR_PROXY: ${LDK_TOR_PROXY:-tor-proxy:9050}
      # auto: check funding outputs when bitcoind answers, else serve unverified channels.
      ALLOD_GOSSIP_VERIFY: ${ALLOD_GOSSIP_VERIFY:-auto}
      ALLOD_GOSSIP_BITCOIND_URL: http://${BITCOIND_RPC_ADDRESS:-bitcoind:8332}
      BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:-ldk}
      BITCOIND_RPC_PASS: ${BITCOIND_RPC_PASS:-}
      ALLOD_GOSSIP_SCAN_INTERVAL_SECS: ${ALLOD_GOSSIP_SCAN_INTERVAL_SECS:-1800}
      RUST_LOG: ${ALLOD_GOSSIP_LOG:-info}
    volumes:
      - gossip-data:/data

  ldk-server:
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod-ldk-server:${ALLOD_VERSION:-dev}
    build: *build-ldk
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *logging
    depends_on:
      bitcoind: { condition: service_healthy, required: false }
      tor-proxy: { condition: service_started }
      gossip: { condition: service_started, required: false }
    environment:
      LDK_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      LDK_CHAIN: ${ALLOD_CHAIN:-bundled}
      LDK_BITCOIND_RPC_ADDRESS: ${BITCOIND_RPC_ADDRESS:-bitcoind:8332}
      LDK_BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:-ldk}
      LDK_BITCOIND_RPC_PASS: ${BITCOIND_RPC_PASS:-}
      LDK_ELECTRUM_URL: ${LDK_ELECTRUM_URL:-}
      LDK_ESPLORA_URL: ${LDK_ESPLORA_URL:-}
      LDK_ALIAS: ${ALLOD_ALIAS:-}
      # Two listeners (SPEC §12.7.2): 9735 inside the stack (Tor's onion service and the
      # gateway tunnel connect there), 9734 behind the host port below. Settings ->
      # Lightning -> Connectivity closes 9734 unless the home IP option is on, so with Tor
      # or a gateway the node is not reachable at the home IP.
      LDK_LISTEN: 0.0.0.0:9735
      LDK_HOST_LISTEN: 0.0.0.0:9734
      # Used until a choice is made in Settings -> Lightning -> Connectivity.
      LDK_ANNOUNCE: ${ALLOD_ANNOUNCE_ADDRESSES:-}
      # 0 accepts inbound anchor channels without an on-chain balance per channel.
      # Raise it to keep a fee-bump safety margin (UI warns when it is below 25k/channel).
      LDK_ANCHOR_PER_CHANNEL_RESERVE_SATS: ${LDK_ANCHOR_PER_CHANNEL_RESERVE_SATS:-0}
      LDK_GRPC_ADDRESS: 0.0.0.0:3536
      LDK_TLS_HOSTS: ldk-server
      # rgs (default) takes the graph from the local gossip sidecar; set LDK_RGS_URL for
      # a public RGS server instead, or LDK_GOSSIP=p2p for ldk-node's own gossip.
      LDK_GOSSIP: ${LDK_GOSSIP:-rgs}
      LDK_RGS_URL: ${LDK_RGS_URL:-http://gossip:8090/snapshot}
      # How long the entry point waits for the sidecar's first verified graph before
      # falling back to p2p. Only the first start of a new stack waits noticeably.
      LDK_RGS_WAIT_SECS: ${LDK_RGS_WAIT_SECS:-600}
      # Keep P2P gossip independent of Rapid Gossip Sync's external scorer.
      LDK_SERVER_PATHFINDING_SCORES_SOURCE_URL: ${LDK_SERVER_PATHFINDING_SCORES_SOURCE_URL-}
      # Comma-separated pubkey@host:port seeds connected at startup and persisted.
      # LDK full-syncs gossip only from the first five gossip-capable connections
      # per process (reconnections count), so a restart otherwise risks keeping
      # whatever partial graph a weak peer dumped. Gossip-only: no channel, no
      # trust. Set empty to disable.
      LDK_BOOTSTRAP_PEERS: ${LDK_BOOTSTRAP_PEERS-03864ef025fde8fb587d989186ce6a4a186895ee44a926bfc370e2c366597a3f8f@3.33.236.230:9735,0217890e3aad8d35bc054f43acc00084b25229ecff0ab68debd82883ad65ee8266@66.109.24.41:9735,0242a4ae0c5bef18048fbecf995094b74bfb0f7391418d71ed394784373f41e4f3@3.124.63.44:9735,033d8656219478701227199cbd6f670335c8d408a92ae88b962c49d4dc0e83e025@34.65.85.39:9735,02437c00ef5de2686a6bd60f8acb5c83d17010916010a15f479d5ef84c04f04485@67.208.234.136:9735,027100442c3b79f606f80f322d98d499eefcb060599efc5d4ecb00209c2cb54190@3.226.165.222:9735}
      LDK_SEED_HANDOFF: ${LDK_SEED_HANDOFF:-true}
      LDK_POSTGRES_URL: ${LDK_POSTGRES_URL:-}
      LDK_TOR_PROXY: ${LDK_TOR_PROXY:-tor-proxy:9050}
      LDK_LOG_LEVEL: ${LDK_LOG_LEVEL:-Info}
      # LSPS2 LSP for just-in-time receive channels (SPEC §2.3). Unset uses the default
      # below; explicitly empty (LDK_LSPS2_LSP=) disables it. The same setting reaches
      # Allod, so it can offer JIT receive in the UI.
      LDK_LSPS2_LSP: ${LDK_LSPS2_LSP:-}
      LDK_LSPS2_LSP_TOKEN: ${LDK_LSPS2_LSP_TOKEN:-}
      LDK_LSPS2_LSP_TRUST_0CONF: ${LDK_LSPS2_LSP_TRUST_0CONF:-false}
      # On mainnet ldk-node refuses to start without bitcoind fee estimates; a node
      # synced from a snapshot has none for hours or days. false starts it anyway.
      LDK_WAIT_FOR_FEES: ${LDK_WAIT_FOR_FEES:-true}
      # Backup profile also enables replica-backed channel-state fencing. Installer
      # creates a per-host ID; restore tooling rotates it before requesting takeover.
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-us-east-1}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      ALLOD_INSTANCE_ID: ${ALLOD_INSTANCE_ID:-}
      LDK_RESTORE_FENCE_POLL_SECS: ${LDK_RESTORE_FENCE_POLL_SECS:-5}
    sysctls:
      # Guard against ephemeral-port exhaustion from ldk-node's bitcoind RPC retries (O-12).
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "10240 65000"
    ports:
      - "${ALLOD_LIGHTNING_PORT:-9735}:9734"
    volumes:
      - ldk-data:/data
      - handoff:/handoff

  allod:
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/allod.Dockerfile, target: allod }
    restart: unless-stopped
    logging: *logging
    environment:
      ALLOD_MODE: managed
      ALLOD_PLATFORM: ${ALLOD_PLATFORM:-docker}
      ALLOD_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      ALLOD_CHAIN: ${ALLOD_CHAIN:-bundled}
      ALLOD_LDK_SERVER_ADDRESS: ldk-server:3536
      # Read-only bitcoind access for sync progress (bundled / external-bitcoind).
      ALLOD_BITCOIND_RPC_URL: ${ALLOD_BITCOIND_RPC_URL:-http://${BITCOIND_RPC_ADDRESS:-bitcoind:8332}}
      ALLOD_BITCOIND_RPC_USER: ${BITCOIND_RO_RPC_USER:-allod-ro}
      ALLOD_BITCOIND_RPC_PASS: ${BITCOIND_RO_RPC_PASS:-}
      # Status of the local gossip sidecar; set empty when LDK_GOSSIP is not the sidecar.
      ALLOD_GOSSIP_SIDECAR_URL: ${ALLOD_GOSSIP_SIDECAR_URL-http://gossip:8090/status}
      # Node explorer for pubkey links in the UI ({pubkey} is replaced); empty: no links.
      ALLOD_NODE_EXPLORER_URL: ${ALLOD_NODE_EXPLORER_URL-https://amboss.space/node/{pubkey}}
      ALLOD_RELAYS: ${ALLOD_RELAYS:-}
      ALLOD_CLIENT_RELAYS: ${ALLOD_CLIENT_RELAYS:-}
      ALLOD_PROFILE_RELAYS: ${ALLOD_PROFILE_RELAYS:-}
      # Mirrors LDK_LSPS2_LSP: Allod offers JIT receive only while an LSP is configured.
      ALLOD_LSPS2_LSP: ${LDK_LSPS2_LSP-034066e29e402d9cf55af1ae1026cc5adf92eed1e0e421785442f53717ad1453b0@64.23.159.177:9735,0388948c5c7775a5eda3ee4a96434a270f20f5beeed7e9c99f242f21b87d658850@stablechannels.com:9735}
      ALLOD_PUBLIC_URL: ${ALLOD_PUBLIC_URL:-}
      # DNSSEC proofs for paying BIP-353 names (SPEC §11.3); empty: 1.1.1.1:53.
      ALLOD_DNS_RESOLVER: ${ALLOD_DNS_RESOLVER:-}
      # Public name check (SPEC §12.1): reach Caddy inside the stack, so no hairpin NAT is needed.
      ALLOD_TLS_CHECK_ADDR: ${ALLOD_TLS_CHECK_ADDR-caddy:443}
      # Gateways (SPEC §12.7): Allod writes the tunnel's WireGuard configuration here.
      ALLOD_TUNNEL_DIR: /tunnel
      # Lightning connectivity: the node's onion service (shared with tor-proxy), the proxy
      # its address is checked through, and the host port of the home IP option.
      ALLOD_TOR_DIR: /tor
      ALLOD_TOR_PROXY: ${LDK_TOR_PROXY:-tor-proxy:9050}
      ALLOD_LIGHTNING_HOST_PORT: ${ALLOD_LIGHTNING_PORT:-9735}
      # The starting choice there: these addresses as "home IP", or private when empty.
      ALLOD_ANNOUNCE_ADDRESSES: ${ALLOD_ANNOUNCE_ADDRESSES:-}
      ALLOD_DATABASE_URL: ${ALLOD_DATABASE_URL:-}
      ALLOD_LOG: ${ALLOD_LOG:-info}
      ALLOD_LOG_FORMAT: ${ALLOD_LOG_FORMAT:-text}
      ALLOD_DEV_AUTO_SETUP: ${ALLOD_DEV_AUTO_SETUP:-}
      ALLOD_DEV_OWNER_PUBKEY: ${ALLOD_DEV_OWNER_PUBKEY:-}
      # Testing only: setup offers to skip the recovery phrase check, on any network.
      ALLOD_SKIP_BACKUP_CHECK: ${ALLOD_SKIP_BACKUP_CHECK:-}
    ports:
      # Local only by default. Remote access goes through Caddy (https) or Tor.
      - "${ALLOD_HTTP_BIND:-127.0.0.1:8029}:8029"
    volumes:
      - allod-data:/data
      - handoff:/handoff
      - bitcoind-control:/control
      - tunnel:/tunnel
      - tor-control:/tor

  caddy:
    profiles: [https]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [allod]
    # Let's Encrypt needs no contact email: without ACME_EMAIL the email line is dropped.
    # An updated Caddyfile (install.sh writes it in place) is picked up within 15 s:
    # the copy in /tmp changes and Caddy (--watch) reloads it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        render() {
          if [ -n "$$ACME_EMAIL" ]; then cat /etc/caddy/Caddyfile
          else grep -v '^[[:space:]]*email ' /etc/caddy/Caddyfile; fi >/tmp/Caddyfile.new
          cmp -s /tmp/Caddyfile.new /tmp/Caddyfile || mv /tmp/Caddyfile.new /tmp/Caddyfile
        }
        render
        (while sleep 15; do render; done) &
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile --watch
    environment:
      ALLOD_DOMAIN: ${ALLOD_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      # Host ports; rootless Docker or a relay setup may need others (e.g. 8443).
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Home end of the gateway tunnels (SPEC §12.7): WireGuard out to each gateway, HTTPS
  # arriving through it on to Caddy (https profile), Lightning on to ldk-server. Outbound
  # only: no port forward needed. Always running, so a gateway can be added from the UI;
  # it idles until Allod writes a configuration with a gateway in it.
  tunnel:
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod-tunnel:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/tunnel.Dockerfile }
    restart: unless-stopped
    logging: *logging
    depends_on:
      caddy: { condition: service_started, required: false }
    cap_add: [NET_ADMIN]
    environment:
      # Lightning through a gateway (Settings → Lightning): where connections go.
      TUNNEL_LIGHTNING_TARGET: ldk-server:9735
    volumes:
      - tunnel:/tunnel

  tor-proxy:
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod-tor:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/tor.Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      TOR_WEB_TARGET: none
      TOR_LIGHTNING_TARGET: none
      # The node's onion service, on while Allod's Settings -> Lightning asks for it.
      TOR_CONTROL_DIR: /control
      TOR_NODE_TARGET: ldk-server:9735
    volumes:
      - tor-proxy-data:/var/lib/tor
      - tor-control:/control

  tor:
    profiles: [tor]
    image: ${ALLOD_REGISTRY:-docker.io/allodme}/allod-tor:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/tor.Dockerfile }
    restart: unless-stopped
    logging: *logging
    depends_on: [allod, ldk-server]
    environment:
      TOR_WEB_TARGET: allod:8029
      TOR_LIGHTNING_TARGET: ${TOR_LIGHTNING_TARGET:-ldk-server:9735}
    volumes:
      - tor-data:/var/lib/tor

  litestream:
    profiles: [backup]
    image: litestream/litestream:0.5.17
    restart: unless-stopped
    logging: *logging
    user: "1000:1000"
    depends_on: [ldk-server, allod]
    command: ["replicate", "-config", "/etc/litestream.yml"]
    environment:
      ALLOD_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-us-east-1}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - ldk-data:/ldk
      - allod-data:/allod

  postgres:
    profiles: [postgres]
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: allod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: allod
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "allod"]
      interval: 10s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  bitcoind-data:
  bitcoind-control:
  ldk-data:
  allod-data:
  handoff:
  caddy-data:
  caddy-config:
  tor-data:
  tor-proxy-data:
  tor-control:
  postgres-data:
  gossip-data:
  tunnel:
