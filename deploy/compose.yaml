# Allod full-node stack (SPEC §2.3). One file for VPS, Umbrel/StartOS wrappers and
# the regtest overlay (compose.regtest.yaml).
#
# Quick start (VPS):
#   cp .env.example .env   # then edit: network, chain mode, passwords, profiles
#   docker compose up -d
#   open http://127.0.0.1:8029 (SSH tunnel) or https://$ALLOD_DOMAIN with the https profile
#
# Profiles (COMPOSE_PROFILES in .env):
#   bundled   run bitcoind in this stack (ALLOD_CHAIN=bundled or bundled-rest)
#   https     Caddy with automatic Let's Encrypt for ALLOD_DOMAIN
#   tor       onion services for the web UI and Lightning P2P
#   backup    Litestream replication of the node and Allod databases
#   postgres  PostgreSQL for Allod and ldk-server
#   electrs   Electrum/Esplora server for your own wallets (needs BITCOIN_PRUNE=0)

name: allod

x-build-ldk: &build-ldk
  context: ..
  dockerfile: images/ldk-server.Dockerfile

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  bitcoind:
    profiles: [bundled]
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-bitcoind:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/bitcoind.Dockerfile }
    restart: unless-stopped
    stop_grace_period: 5m
    # Keep an unexpected bitcoind spike from consuming host RAM or swap.
    mem_limit: ${BITCOIN_MEMORY_LIMIT:-2g}
    memswap_limit: ${BITCOIN_MEMORY_LIMIT:-2g}
    logging: *logging
    environment:
      BITCOIN_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      BITCOIN_PRUNE: ${BITCOIN_PRUNE:-50000}
      BITCOIN_DBCACHE: ${BITCOIN_DBCACHE:-450}
      BITCOIN_SYNC_TUNING: ${BITCOIN_SYNC_TUNING:-auto}
      # Bundled bitcoind's RPC port; keep in sync with BITCOIND_RPC_ADDRESS below.
      BITCOIN_RPC_PORT: "${BITCOIN_RPC_PORT:-8332}"
      BITCOIN_RPC_USER: ${BITCOIND_RPC_USER:-ldk}
      BITCOIN_RPC_PASS: ${BITCOIND_RPC_PASS:?set BITCOIND_RPC_PASS in .env}
      BITCOIN_RO_RPC_USER: ${BITCOIND_RO_RPC_USER:-allod-ro}
      BITCOIN_RO_RPC_PASS: ${BITCOIND_RO_RPC_PASS:?set BITCOIND_RO_RPC_PASS in .env}
      BITCOIN_REST: ${BITCOIN_REST:-1}
      BITCOIN_TXINDEX: ${BITCOIN_TXINDEX:-0}
      BITCOIN_BLOCKFILTERINDEX: ${BITCOIN_BLOCKFILTERINDEX:-1}
      BITCOIN_DISABLE_WALLET: ${BITCOIN_DISABLE_WALLET:-1}
      BITCOIN_EXTRA_CONF: ${BITCOIN_EXTRA_CONF:-}
    volumes:
      - bitcoind-data:/data
      # Fast sync requests from the setup wizard (AssumeUTXO, optional).
      - bitcoind-control:/control

  bitcoind-proxy:
    profiles: [bundled]
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-bitcoind-proxy:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/allod.Dockerfile, target: bitcoind-proxy }
    restart: unless-stopped
    logging: *logging
    depends_on:
      bitcoind: { condition: service_healthy }
    environment:
      BITCOIND_PROXY_UPSTREAM_URL: http://${BITCOIND_RPC_ADDRESS:-bitcoind:8332}
      BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:-ldk}
      BITCOIND_RPC_PASS: ${BITCOIND_RPC_PASS:?set BITCOIND_RPC_PASS in .env}
      BITCOIND_PROXY_MAX_FETCHES: ${BITCOIND_PROXY_MAX_FETCHES:-4}
      BITCOIND_PROXY_FETCH_TIMEOUT_SECS: ${BITCOIND_PROXY_FETCH_TIMEOUT_SECS:-240}
      BITCOIND_PROXY_PEER_TIMEOUT_SECS: ${BITCOIND_PROXY_PEER_TIMEOUT_SECS:-15}

  ldk-server:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-ldk-server:${ALLOD_VERSION:-dev}
    build: *build-ldk
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *logging
    depends_on:
      bitcoind: { condition: service_healthy, required: false }
      bitcoind-proxy: { condition: service_healthy, required: false }
      tor-proxy: { condition: service_started }
    environment:
      LDK_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      LDK_CHAIN: ${ALLOD_CHAIN:-bundled}
      LDK_BITCOIND_RPC_ADDRESS: ${BITCOIND_RPC_ADDRESS:-bitcoind:8332}
      # Entry point substitutes this only for bundled modes. External bitcoind keeps
      # using its configured RPC address directly unless operator enables a proxy.
      LDK_BITCOIND_PROXY_ADDRESS: ${LDK_BITCOIND_PROXY_ADDRESS:-bitcoind-proxy:8332}
      LDK_BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:-ldk}
      LDK_BITCOIND_RPC_PASS: ${BITCOIND_RPC_PASS:-}
      LDK_ELECTRUM_URL: ${LDK_ELECTRUM_URL:-}
      LDK_ESPLORA_URL: ${LDK_ESPLORA_URL:-}
      LDK_ALIAS: ${ALLOD_ALIAS:-allod}
      LDK_LISTEN: 0.0.0.0:9735
      LDK_ANNOUNCE: ${ALLOD_ANNOUNCE_ADDRESSES:-}
      # 0 accepts inbound anchor channels without an on-chain balance per channel.
      # Raise it to keep a fee-bump safety margin (UI warns when it is below 25k/channel).
      LDK_ANCHOR_PER_CHANNEL_RESERVE_SATS: ${LDK_ANCHOR_PER_CHANNEL_RESERVE_SATS:-0}
      LDK_GRPC_ADDRESS: 0.0.0.0:3536
      LDK_TLS_HOSTS: ldk-server
      LDK_GOSSIP: ${LDK_GOSSIP:-p2p}
      LDK_RGS_URL: ${LDK_RGS_URL:-https://rapidsync.lightningdevkit.org/snapshot/v2/}
      # Keep P2P gossip independent of Rapid Gossip Sync's external scorer.
      LDK_SERVER_PATHFINDING_SCORES_SOURCE_URL: ${LDK_SERVER_PATHFINDING_SCORES_SOURCE_URL-}
      # Comma-separated pubkey@host:port seeds connected at startup and persisted.
      # LDK full-syncs gossip only from the first five gossip-capable connections
      # per process (reconnections count), so a restart otherwise risks keeping
      # whatever partial graph a weak peer dumped. Gossip-only: no channel, no
      # trust. Set empty to disable.
      LDK_BOOTSTRAP_PEERS: ${LDK_BOOTSTRAP_PEERS-03864ef025fde8fb587d989186ce6a4a186895ee44a926bfc370e2c366597a3f8f@3.33.236.230:9735,0217890e3aad8d35bc054f43acc00084b25229ecff0ab68debd82883ad65ee8266@66.109.24.41:9735,0242a4ae0c5bef18048fbecf995094b74bfb0f7391418d71ed394784373f41e4f3@3.124.63.44:9735,033d8656219478701227199cbd6f670335c8d408a92ae88b962c49d4dc0e83e025@34.65.85.39:9735,02437c00ef5de2686a6bd60f8acb5c83d17010916010a15f479d5ef84c04f04485@67.208.234.136:9735,027100442c3b79f606f80f322d98d499eefcb060599efc5d4ecb00209c2cb54190@3.226.165.222:9735}
      LDK_SEED_HANDOFF: ${LDK_SEED_HANDOFF:-true}
      LDK_POSTGRES_URL: ${LDK_POSTGRES_URL:-}
      LDK_TOR_PROXY: ${LDK_TOR_PROXY:-tor-proxy:9050}
      LDK_LOG_LEVEL: ${LDK_LOG_LEVEL:-Info}
      # LSPS2 LSP for just-in-time receive channels (SPEC §2.3). Unset uses the default
      # below; explicitly empty (LDK_LSPS2_LSP=) disables it. The same setting reaches
      # Allod, so it can offer JIT receive in the UI.
      LDK_LSPS2_LSP: ${LDK_LSPS2_LSP:-}
      LDK_LSPS2_LSP_TOKEN: ${LDK_LSPS2_LSP_TOKEN:-}
      LDK_LSPS2_LSP_TRUST_0CONF: ${LDK_LSPS2_LSP_TRUST_0CONF:-false}
      # On mainnet ldk-node refuses to start without bitcoind fee estimates; a node
      # synced from a snapshot has none for hours or days. false starts it anyway.
      LDK_WAIT_FOR_FEES: ${LDK_WAIT_FOR_FEES:-true}
    sysctls:
      # Guard against ephemeral-port exhaustion from ldk-node's bitcoind RPC retries (O-12).
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "10240 65000"
    ports:
      - "${ALLOD_LIGHTNING_PORT:-9735}:9735"
    volumes:
      - ldk-data:/data
      - handoff:/handoff

  allod:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/allod.Dockerfile, target: allod }
    restart: unless-stopped
    logging: *logging
    environment:
      ALLOD_MODE: managed
      ALLOD_PLATFORM: ${ALLOD_PLATFORM:-docker}
      ALLOD_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      ALLOD_CHAIN: ${ALLOD_CHAIN:-bundled}
      ALLOD_LDK_SERVER_ADDRESS: ldk-server:3536
      # Read-only bitcoind access for sync progress (bundled / external-bitcoind).
      ALLOD_BITCOIND_RPC_URL: ${ALLOD_BITCOIND_RPC_URL:-http://${BITCOIND_RPC_ADDRESS:-bitcoind:8332}}
      ALLOD_BITCOIND_RPC_USER: ${BITCOIND_RO_RPC_USER:-allod-ro}
      ALLOD_BITCOIND_RPC_PASS: ${BITCOIND_RO_RPC_PASS:-}
      ALLOD_GOSSIP_PROXY_URL: ${ALLOD_GOSSIP_PROXY_URL:-}
      ALLOD_RELAYS: ${ALLOD_RELAYS:-}
      ALLOD_CLIENT_RELAYS: ${ALLOD_CLIENT_RELAYS:-}
      ALLOD_PROFILE_RELAYS: ${ALLOD_PROFILE_RELAYS:-}
      # Mirrors LDK_LSPS2_LSP: Allod offers JIT receive only while an LSP is configured.
      ALLOD_LSPS2_LSP: ${LDK_LSPS2_LSP-034066e29e402d9cf55af1ae1026cc5adf92eed1e0e421785442f53717ad1453b0@64.23.159.177:9735}
      ALLOD_PUBLIC_URL: ${ALLOD_PUBLIC_URL:-}
      ALLOD_DATABASE_URL: ${ALLOD_DATABASE_URL:-}
      ALLOD_LOG: ${ALLOD_LOG:-info}
      ALLOD_LOG_FORMAT: ${ALLOD_LOG_FORMAT:-text}
      ALLOD_DEV_AUTO_SETUP: ${ALLOD_DEV_AUTO_SETUP:-}
      ALLOD_DEV_OWNER_PUBKEY: ${ALLOD_DEV_OWNER_PUBKEY:-}
    ports:
      # Local only by default. Remote access goes through Caddy (https) or Tor.
      - "${ALLOD_HTTP_BIND:-127.0.0.1:8029}:8029"
    volumes:
      - allod-data:/data
      - handoff:/handoff
      - bitcoind-control:/control

  caddy:
    profiles: [https]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [allod]
    environment:
      ALLOD_DOMAIN: ${ALLOD_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  tor-proxy:
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-tor:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/tor.Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      TOR_WEB_TARGET: none
      TOR_LIGHTNING_TARGET: none
    volumes:
      - tor-proxy-data:/var/lib/tor

  tor:
    profiles: [tor]
    image: ${ALLOD_REGISTRY:-ghcr.io/frnandu}/allod-tor:${ALLOD_VERSION:-dev}
    build: { context: .., dockerfile: images/tor.Dockerfile }
    restart: unless-stopped
    logging: *logging
    depends_on: [allod, ldk-server]
    environment:
      TOR_WEB_TARGET: allod:8029
      TOR_LIGHTNING_TARGET: ${TOR_LIGHTNING_TARGET:-ldk-server:9735}
    volumes:
      - tor-data:/var/lib/tor

  litestream:
    profiles: [backup]
    image: litestream/litestream:0.5.17
    restart: unless-stopped
    logging: *logging
    user: "1000:1000"
    depends_on: [ldk-server, allod]
    command: ["replicate", "-config", "/etc/litestream.yml"]
    environment:
      ALLOD_NETWORK: ${ALLOD_NETWORK:-bitcoin}
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - ldk-data:/ldk
      - allod-data:/allod

  postgres:
    profiles: [postgres]
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: allod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: allod
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "allod"]
      interval: 10s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  electrs:
    profiles: [electrs]
    image: mempool/electrs:v3.3.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      bitcoind: { condition: service_healthy }
    command:
      - --network=${ELECTRS_NETWORK:-mainnet}
      - --daemon-rpc-addr=${BITCOIND_RPC_ADDRESS:-bitcoind:8332}
      - --cookie=${BITCOIND_RPC_USER:-ldk}:${BITCOIND_RPC_PASS:-}
      - --jsonrpc-import
      - --db-dir=/data
      - --electrum-rpc-addr=0.0.0.0:50001
      - --http-addr=0.0.0.0:3002
    volumes:
      - electrs-data:/data

volumes:
  bitcoind-data:
  bitcoind-control:
  ldk-data:
  allod-data:
  handoff:
  caddy-data:
  caddy-config:
  tor-data:
  tor-proxy-data:
  postgres-data:
  electrs-data:
