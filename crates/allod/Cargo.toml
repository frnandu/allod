[package]
name = "allod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Allod: self-custodial Lightning wallet service and NWC server for ldk-server"

[features]
default = ["embed-ui"]
embed-ui = ["allod-api/embed-ui"]

[dependencies]
allod-types = { workspace = true }
allod-db = { workspace = true }
allod-api = { workspace = true, default-features = false }
allod-core = { workspace = true }
allod-keys = { workspace = true }
allod-ln = { workspace = true }
allod-nwc = { workspace = true }
sqlx = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
