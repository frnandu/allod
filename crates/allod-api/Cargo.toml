[package]
name = "allod-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["embed-ui"]
# Embed web/dist into the binary. Without it, `/` answers with a short notice.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
allod-types = { workspace = true }
allod-db = { workspace = true }
allod-ln = { workspace = true }
allod-core = { workspace = true }
allod-nwc = { workspace = true }
zeroize = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
nostr = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

[dev-dependencies]
allod-keys = { workspace = true }
allod-ln = { workspace = true, features = ["mock"] }
tower = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
