[package]
name = "allod-lnurl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "LNURL-pay: client for Lightning addresses (LUD-16), LNURL (LUD-06), comments (LUD-12); server-side checks and NIP-57 zap receipts"

[dependencies]
bech32 = { workspace = true }
hex = { workspace = true }
# Signing zap receipts needs randomness.
nostr = { workspace = true, features = ["os-rng"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
