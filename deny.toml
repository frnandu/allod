# cargo-deny: licenses, advisories, sources (SPEC §1.3, §15).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Bundled SQLite < 3.54.0 (CVE-2026-119375). The fix needs libsqlite3-sys >= 0.39, and
    # every sqlx release (0.9.0 included) caps it below 0.38, so there is no upgrade yet.
    # The bug needs a crafted database + `-wal` pair written by a less trusted party; Allod
    # only opens its own database in its data dir. Remove once sqlx allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite via sqlx-sqlite; no sqlx release allows the fixed libsqlite3-sys; only our own database file is opened" },
]

[licenses]
version = 2
# Allod is MIT. Only permissive licenses (and MPL-2.0, file-level copyleft) are allowed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    # MIT + "no false attribs" (hex_lit, via the bitcoin crate): permissive, MIT-compatible.
    "MITNFA",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned by commit in Cargo.toml: ldk-server (its client crate) and rust-lightning at the
# commit the pinned ldk-node uses (the gossip sidecar's RGS snapshots must match it).
allow-git = [
    "https://github.com/lightningdevkit/ldk-server.git",
    "https://github.com/lightningdevkit/rust-lightning",
]
