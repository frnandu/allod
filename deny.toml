# cargo-deny: licenses, advisories, sources (SPEC §1.3, §15).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# All of these come from ldk-server-client's pinned HTTP/TLS stack (reqwest 0.11,
# hyper 0.14, rustls 0.21). Allod cannot upgrade them on its side; tracked as SPEC open
# item O-11. Exposure is limited: the client only talks to our own ldk-server over the
# internal network, pinned to that server's self-signed certificate.
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 1 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 via ldk-server-client (O-11)" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.25 via ldk-server-client; roots unused for the pinned cert (O-11)" },
    # nostr 0.44 depends on `instant` only for wasm32 targets; it is never built for Allod.
    { id = "RUSTSEC-2024-0384", reason = "instant (unmaintained) via nostr 0.44, wasm32-only" },
]

[licenses]
version = 2
# Allod is MIT. Only permissive licenses (and MPL-2.0, file-level copyleft) are allowed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    # MIT + "no false attribs" (hex_lit, via the bitcoin crate): permissive, MIT-compatible.
    "MITNFA",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/lightningdevkit/ldk-server.git"]
