# Allod appliance (SPEC §2.3.10). Ethernet gets DHCP automatically; Wi-Fi networks are
# saved under /etc/NetworkManager/system-connections, which allod-data-setup binds to
# the data disk.
[main]
plugins=keyfile
dns=systemd-resolved

[connection]
# Power saving makes the Raspberry Pi's Wi-Fi drop out under load.
wifi.powersave=2
