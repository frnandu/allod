<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Allod</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e11; color: #8a96a1;
    font: 16px "DejaVu Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  svg { width: 480px; max-width: 80vw; height: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f7931a;
    animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<svg viewBox="0 0 120 32" aria-label="Allod">
  <rect width="32" height="32" rx="9" fill="#2dd4bf"/>
  <path d="M8 24 16 9.5 24 24M11.6 18.5h8.8" fill="none" stroke="#04201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="9.5" r="2.6" fill="#f7931a"/>
  <text x="42" y="24" font-family="DejaVu Sans" font-weight="bold" font-size="22" fill="#e6ebef">Allod</text>
</svg>
<div class="dot"></div>
<div id="msg">Starting…</div>
<script>
  // Opens the web UI as soon as Allod answers. An opaque (no-cors) response is enough:
  // fetch only rejects while nothing listens on the port.
  const ui = "http://localhost:8029/";
  let tries = 0;
  async function poll() {
    try {
      await fetch(ui + "api/health", { mode: "no-cors", cache: "no-store" });
      location.replace(ui);
    } catch {
      if (++tries === 60) document.getElementById("msg").textContent =
        "Still starting. Press Ctrl+Alt+F2 for a console.";
      setTimeout(poll, 500);
    }
  }
  poll();
</script>
</body>
</html>
