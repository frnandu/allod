# Menu hidden: hold Shift or press Esc during the 1 s timeout to show it.
set timeout_style=hidden
set timeout=1
set default=0
# GRUB also uses the first serial port (headless machines, VMs).
serial --unit=0 --speed=115200
terminal_input console serial
# Graphics mode from the start, kept for the kernel, so the splash shows without a mode
# switch. Without a graphics adapter, stay in text mode: keeping a graphics mode that
# does not exist stops GRUB at an error that waits for a key.
insmod all_video
insmod gfxterm
set gfxmode=auto
if terminal_output gfxterm serial; then
  set gfxpayload=keep
else
  terminal_output console serial
  set gfxpayload=text
fi
# No serial console on the kernel line of the splash entries: plymouth falls back to text
# mode when one is set.

menuentry "Allod" {
  linux /live/vmlinuz boot=live quiet splash plymouth.use-simpledrm loglevel=3 vt.global_cursor_default=0
  initrd /live/initrd.img
}

menuentry "Allod (never format a disk automatically)" {
  linux /live/vmlinuz boot=live quiet splash plymouth.use-simpledrm loglevel=3 vt.global_cursor_default=0 allod.noformat
  initrd /live/initrd.img
}

menuentry "Allod (headless: no kiosk browser)" {
  linux /live/vmlinuz boot=live quiet loglevel=3 console=tty0 console=ttyS0,115200 allod.nokiosk
  initrd /live/initrd.img
}
