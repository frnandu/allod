# Builds, pushes and signs the multi-arch images (SPEC §2.3.8). Called by release.yml
# (release profile, attested) and nightly.yml (fast-release profile).
#
# Each image is built natively per architecture (arm64 on GitHub's arm runners, no QEMU),
# pushed by digest, then merged into one multi-arch manifest that is tagged and signed.
# ldk-server is only recompiled when its pin (LDK_SERVER_REV) changes: every release-profile
# build is also tagged `ldk-<rev>`, and later runs take the binaries from that image
# (LDK_BINARIES) and rebuild only the runtime stage, so the entrypoint scripts are current.
# Rust builds go through sccache on the GitHub Actions cache (images/cargo-sccache.sh).
#
# Unchanged images are not rebuilt at all. Every published image except allod (which
# bakes in the version) carries the label me.allod.inputs, the hash of its inputs
# (scripts/image-hash.sh: Dockerfile, the files it copies, profile, attestations,
# platforms). When the previous image of the channel (the `previous` tag: latest for
# releases, nightly for nightlies) has the same hash, the image is left out of the build
# and that manifest is tagged with the new version: same digest, so the bundle pins the
# same image, users pull nothing and Compose keeps bitcoind and ldk-server running.
# Rebuilt images keep their unchanged layers byte-identical: besides the GitHub Actions
# cache, which evicts entries, each build reads the inline cache embedded in the previous
# image, so a script change ships only the layer holding the script.
name: Images


on:
  workflow_call:
    inputs:
      tags:
        description: Space-separated image tags; the first one is used to read the digest
        type: string
        required: true
      push:
        description: Push and sign the images (otherwise build only)
        type: boolean
        required: true
      profile:
        description: Cargo profile, release or fast-release
        type: string
        required: true
      attest:
        description: Attach SBOM and provenance attestations
        type: boolean
        required: true
      arm64:
        description: Also build linux/arm64 (otherwise linux/amd64 only)
        type: boolean
        required: true
      previous:
        description: Tag of the channel's previous images (latest, nightly), reused when unchanged; empty rebuilds all
        type: string
        required: false
        default: ""
      rebuild:
        description: Rebuild every image, even those whose inputs did not change
        type: boolean
        required: false
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub access token (Read & Write) of DOCKERHUB_USER
        required: true
    outputs:
      allod:
        value: ${{ jobs.merge.outputs.allod }}
      allod-ldk-server:
        value: ${{ jobs.merge.outputs.allod-ldk-server }}
      allod-bitcoind:
        value: ${{ jobs.merge.outputs.allod-bitcoind }}
      allod-gossip:
        value: ${{ jobs.merge.outputs.allod-gossip }}
      allod-tor:
        value: ${{ jobs.merge.outputs.allod-tor }}
      allod-tunnel:
        value: ${{ jobs.merge.outputs.allod-tunnel }}

# Images go to Docker Hub. The user name is not a secret: it is part of every image
# reference, and a secret value would be masked out of the job outputs that carry them.
env:
  DOCKERHUB_USER: allodme
  REGISTRY: docker.io/allodme

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      ldk_rev: ${{ steps.ldk.outputs.rev }}
      # First of the tags (release version or nightly name), baked into the allod image.
      version: ${{ steps.version.outputs.version }}
      ldk_cached: ${{ steps.ldk.outputs.cached }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      arches: ${{ steps.matrix.outputs.arches }}
      # {"<image>": "<hash>"} for every image except allod (its me.allod.inputs label).
      hashes: ${{ steps.reuse.outputs.hashes }}
      # {"<image>": "sha256:<digest>"} for the previous images reused as they are.
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          case "${{ inputs.profile }}" in
            release|fast-release) ;;
            *) echo "unsupported profile ${{ inputs.profile }}" >&2; exit 1 ;;
          esac
      - id: version
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          read -r -a names <<<"$TAGS"
          echo "version=${names[0]:-}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { username: "${{ env.DOCKERHUB_USER }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      # Only release-profile builds are tagged ldk-<rev>, so a reused ldk-server is always a
      # full release build, nightly included.
      - id: ldk
        run: |
          rev=$(sed -n 's/^ARG LDK_SERVER_REV=//p' images/ldk-server.Dockerfile)
          [ -n "$rev" ] || { echo "LDK_SERVER_REV not found in images/ldk-server.Dockerfile" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$REGISTRY/allod-ldk-server:ldk-$rev" >/dev/null 2>&1; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi
      - id: reuse
        env:
          PROFILE: ${{ inputs.profile }}
          ATTEST: ${{ inputs.attest }}
          PLATFORMS: ${{ inputs.arm64 && 'amd64,arm64' || 'amd64' }}
          REBUILD: ${{ inputs.rebuild }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          hashes='{}'
          reuse='{}'
          for name in allod-gossip allod-ldk-server allod-bitcoind allod-tor allod-tunnel; do
            hash=$(scripts/image-hash.sh "$name" "profile=$PROFILE" "attest=$ATTEST" "platforms=$PLATFORMS")
            hashes=$(jq -c --arg n "$name" --arg h "$hash" '. + {($n): $h}' <<<"$hashes")
            if [ "$REBUILD" = true ] || [ -z "$PREVIOUS" ]; then
              echo "$name: building ($hash)"
              continue
            fi
            ref="$REGISTRY/$name:$PREVIOUS"
            # A multi-platform index lists one config per platform; each carries the label.
            prev=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '(if has("config") then [.] else [.[]] end) | map(.config.Labels["me.allod.inputs"] // "") | unique | if length == 1 then .[0] else "" end' \
              || true)
            if [ "$prev" = "$hash" ] \
              && digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest); then
              reuse=$(jq -c --arg n "$name" --arg d "$digest" '. + {($n): $d}' <<<"$reuse")
              echo "$name: inputs unchanged since $PREVIOUS, reusing $digest"
            else
              echo "$name: building ($hash; $PREVIOUS has ${prev:-no hash})"
            fi
          done
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          images='[
            {"name": "allod", "dockerfile": "images/allod.Dockerfile", "target": "allod"},
            {"name": "allod-gossip", "dockerfile": "images/allod.Dockerfile", "target": "gossip"},
            {"name": "allod-ldk-server", "dockerfile": "images/ldk-server.Dockerfile", "target": ""},
            {"name": "allod-bitcoind", "dockerfile": "images/bitcoind.Dockerfile", "target": ""},
            {"name": "allod-tor", "dockerfile": "images/tor.Dockerfile", "target": ""},
            {"name": "allod-tunnel", "dockerfile": "images/tunnel.Dockerfile", "target": ""}
          ]'
          platforms='[{"platform": "linux/amd64", "arch": "amd64", "runner": "ubuntu-24.04"}]'
          if [ "${{ inputs.arm64 }}" = true ]; then
            platforms=$(jq '. + [{"platform": "linux/arm64", "arch": "arm64", "runner": "ubuntu-24.04-arm"}]' <<<"$platforms")
          fi
          echo "arches=$(jq length <<<"$platforms")" >> "$GITHUB_OUTPUT"
          # allod is always built, so the matrix is never empty.
          matrix=$(jq -c --argjson platforms "$platforms" --argjson reuse "$REUSE" \
            '{include: [.[] | select(.name as $n | $reuse | has($n) | not) as $i | $platforms[] | $i + .]}' <<<"$images")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: build (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Docker Hub images (debian, alpine, rust, node...) come through Google's mirror of
      # Docker Hub, with the same digests: Docker Hub rate-limits the many parallel pulls
      # of one run (429 Too Many Requests), even logged in. What the mirror lacks (Allod's
      # own images, read as build cache) still comes from Docker Hub; pushes always go there.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # Exposes ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN to the steps, for sccache.
      - uses: crazy-max/ghaction-github-runtime@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with: { username: "${{ env.DOCKERHUB_USER }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # The inputs hash that a later run compares (allod is always rebuilt).
          labels: ${{ fromJSON(needs.meta.outputs.hashes)[matrix.name] && format('me.allod.inputs={0}', fromJSON(needs.meta.outputs.hashes)[matrix.name]) || '' }}
          # A cached ldk-server pin: reuse its binaries, rebuild only the runtime stage.
          build-args: |
            CARGO_PROFILE=${{ inputs.profile }}
            ALLOD_BUILD_VERSION=${{ needs.meta.outputs.version }}
            ${{ matrix.name == 'allod-ldk-server' && needs.meta.outputs.ldk_cached == 'true' && format('LDK_BINARIES={0}/allod-ldk-server:ldk-{1}', env.REGISTRY, needs.meta.outputs.ldk_rev) || '' }}
          secrets: |
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          provenance: ${{ inputs.attest && 'mode=max' || 'false' }}
          sbom: ${{ inputs.attest }}
          # Per profile and arch. The regtest CI (deploy/compose.ci.yaml) uses its own
          # scopes, which must not overwrite these.
          # The registry entry is the inline cache (final stage only) of the channel's
          # previous image: it outlives GitHub's cache eviction, so the runtime layers
          # (packages, binaries) come out byte-identical and users download only the layers
          # that changed. Without a previous image it only logs that nothing was found.
          cache-from: |
            type=gha,scope=${{ inputs.profile }}-${{ matrix.name }}-${{ matrix.arch }}
            ${{ inputs.previous && format('type=registry,ref={0}/{1}:{2}', env.REGISTRY, matrix.name, inputs.previous) || '' }}
          cache-to: |
            type=gha,mode=max,scope=${{ inputs.profile }}-${{ matrix.name }}-${{ matrix.arch }}
            type=inline
      - if: inputs.push
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          # "--" separators: image names prefix each other (allod, allod-tor, ...), so
          # "digests-allod-*" would also match the other images' artifacts.
          name: digests--${{ matrix.name }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    if: inputs.push
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        name: [allod, allod-gossip, allod-ldk-server, allod-bitcoind, allod-tor, allod-tunnel]
    outputs:
      allod: ${{ steps.out.outputs.allod }}
      allod-ldk-server: ${{ steps.out.outputs.allod-ldk-server }}
      allod-bitcoind: ${{ steps.out.outputs.allod-bitcoind }}
      allod-gossip: ${{ steps.out.outputs.allod-gossip }}
      allod-tor: ${{ steps.out.outputs.allod-tor }}
      allod-tunnel: ${{ steps.out.outputs.allod-tunnel }}
    env:
      IMAGE: docker.io/allodme/${{ matrix.name }}
      TAGS: ${{ inputs.tags }}
      LDK_REV: ${{ needs.meta.outputs.ldk_rev }}
      ARCHES: ${{ needs.meta.outputs.arches }}
      TAG_LDK: ${{ matrix.name == 'allod-ldk-server' && inputs.profile == 'release' }}
      # Set when the image's inputs did not change: tag this existing manifest instead.
      REUSE_DIGEST: ${{ fromJSON(needs.meta.outputs.reuse)[matrix.name] || '' }}
    steps:
      - if: env.REUSE_DIGEST == ''
        uses: actions/download-artifact@v4
        with:
          pattern: digests--${{ matrix.name }}--*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { username: "${{ env.DOCKERHUB_USER }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - id: manifest
        run: |
          # shellcheck disable=SC2153 # TAGS is the job's env, tags the list built here
          read -r -a names <<<"$TAGS"
          [ "${#names[@]}" -gt 0 ] || { echo "no tags given" >&2; exit 1; }
          tags=()
          for t in "${names[@]}"; do tags+=(-t "$IMAGE:$t"); done
          # ldk-<rev> marks release-profile binaries of the pin; a rebuild of the runtime
          # stage keeps those binaries, so it may move the tag.
          [ "$TAG_LDK" = true ] && tags+=(-t "$IMAGE:ldk-$LDK_REV")
          if [ -n "$REUSE_DIGEST" ]; then
            # A single index as the source is pushed unchanged under the new tags.
            docker buildx imagetools create "${tags[@]}" "$IMAGE@$REUSE_DIGEST"
          else
            sources=()
            for f in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$f")"); done
            [ "${#sources[@]}" -eq "$ARCHES" ] || { echo "expected $ARCHES platform digests, got ${#sources[@]}" >&2; exit 1; }
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:${names[0]}" --format '{{json .Manifest}}' | jq -r .digest)
          if [ -n "$REUSE_DIGEST" ] && [ "$digest" != "$REUSE_DIGEST" ]; then
            echo "retagging $IMAGE@$REUSE_DIGEST produced $digest; users would download it again" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Reused images are signed again (one more signature on the same digest): the moving
      # tag they came from is set before signing, so a run that failed there left none.
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "$IMAGE@${{ steps.manifest.outputs.digest }}"
      - id: out
        run: echo "${{ matrix.name }}=$IMAGE@${{ steps.manifest.outputs.digest }}" >> "$GITHUB_OUTPUT"
