name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web test
      - run: pnpm -C web build

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just compose-check
      - name: shellcheck
        run: shellcheck -x images/*/*.sh deploy/scripts/*.sh scripts/*.sh

  regtest:
    # Full stack on regtest: bitcoind, three ldk-server nodes, relays, Allod.
    needs: [rust, web, deploy-files]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      - run: just up
      - run: just doctor
      - if: failure()
        run: just ps && docker compose -f deploy/compose.yaml -f deploy/compose.regtest.yaml --env-file deploy/regtest.env logs --no-color > stack.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: regtest-logs, path: stack.log }

  e2e-ui:
    # Fresh regtest stack; Playwright runs the setup wizard and Nostr sign-in (M1).
    needs: [rust, web, deploy-files]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: just e2e-ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: web/test-results/ }
