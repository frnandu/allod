name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      # Run pnpm from web/: corepack resolves the pinned pnpm version from the closest
      # package.json, and from the repository root it would pick the latest release and
      # abort with ERR_PNPM_BAD_PM_VERSION.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just compose-check
      - name: shellcheck
        # -P: where to look for files pulled in with `source` (the scripts ship next to
        # each other inside the images, so the paths only exist there).
        run: shellcheck -x -P images/bitcoind -P images/ldk-server -P images/tor -P deploy/scripts -P scripts images/*/*.sh deploy/scripts/*.sh scripts/*.sh

  regtest:
    # Full stack on regtest: bitcoind, three ldk-server nodes, relays, Allod.
    needs: [rust, web, deploy-files]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # deploy/compose.ci.yaml: reuse BuildKit layers through the GitHub Actions cache.
      CI_DOCKER_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      - run: just up
      - run: just doctor
      - if: failure()
        run: just ps && docker compose -f deploy/compose.yaml -f deploy/compose.regtest.yaml --env-file deploy/regtest.env logs --no-color > stack.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: regtest-logs, path: stack.log }

  e2e-ui:
    # Fresh regtest stack; Playwright runs the setup wizard and Nostr sign-in (M1).
    needs: [rust, web, deploy-files]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_DOCKER_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.4" }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: just e2e-ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: web/test-results/ }
