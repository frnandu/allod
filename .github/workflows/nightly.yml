# Nightly: the e2e matrix, plus images built with the fast-release profile (no LTO,
# parallel codegen) for quick test deployments; no SBOM or provenance. All four images get
# the same tag, `nightly-YYYYMMDD-HHMM` (UTC, when the run was triggered), so it works as
# ALLOD_VERSION for deploy/compose.yaml. Scheduled runs build amd64 + arm64 and also move
# `nightly` on the default branch; manual runs (workflow_dispatch, any branch) build amd64
# only, or amd64 + arm64 with the `arm64` input, and skip the e2e matrix.
# Multi-arch runs on the default branch also publish the Compose bundle (image digests pinned) and install.sh as
# the `nightly` GitHub pre-release, so `install.sh --nightly` can install them.
name: Nightly

on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build linux/arm64 (e.g. for the Raspberry Pi image)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write

jobs:
  e2e-matrix:
    # Manual runs only publish images.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      - run: just build
      - run: just e2e-matrix

  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      # The run's creation time is when it was triggered (scheduled or by hand), and it stays
      # the same on re-runs, so a re-run republishes the same version.
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          version="nightly-$(date -u -d "$created" +%Y%m%d-%H%M)"
          tags="$version"
          # The moving `nightly` tag stays multi-arch: only scheduled runs move it.
          if [ "${{ github.event_name }}" = schedule ] && [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            tags="$tags nightly"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  images:
    needs: meta
    uses: ./.github/workflows/images.yml
    with:
      tags: ${{ needs.meta.outputs.tags }}
      push: true
      profile: fast-release
      attest: false
      # Manual runs are quick test builds: amd64 only unless the arm64 input is set.
      arm64: ${{ github.event_name == 'schedule' || inputs.arm64 }}

  # Appliance images (amd64 ISO, Raspberry Pi image) whenever arm64 images were built.
  appliance:
    needs: [meta, images]
    if: github.event_name == 'schedule' || inputs.arm64
    uses: ./.github/workflows/appliance.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  # The `nightly` pre-release: same assets as a release, replaced by every multi-arch run on
  # the default branch (scheduled, or manual with the arm64 input). amd64-only runs never
  # publish it: arm64 hosts would get a bundle without images for them.
  # Pre-releases never count as "latest", so plain installs keep getting releases.
  bundle:
    needs: [meta, images]
    if: (github.event_name == 'schedule' || inputs.arm64) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose bundle with digests
        run: |
          cat > digests.env <<EOF2
          allod=${{ needs.images.outputs.allod }}
          allod-ldk-server=${{ needs.images.outputs.allod-ldk-server }}
          allod-bitcoind=${{ needs.images.outputs.allod-bitcoind }}
          allod-gossip=${{ needs.images.outputs.allod-gossip }}
          allod-tor=${{ needs.images.outputs.allod-tor }}
          EOF2
          scripts/render-bundle.sh "${{ needs.meta.outputs.version }}" digests.env
      - name: Publish the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly ${{ needs.meta.outputs.version }}" \
            --notes "Untested build of $GITHUB_SHA. Install with: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/install.sh | sh -s -- --nightly"

  summary:
    needs: [meta, images]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          {
            echo "### Nightly images"
            echo
            echo "Every image (allod, allod-gossip, allod-ldk-server, allod-bitcoind, allod-tor) is tagged \`${{ needs.meta.outputs.version }}\`. Deploy with:"
            echo
            echo '```'
            echo "ALLOD_VERSION=${{ needs.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
