# Release pipeline (SPEC §2.3.8): multi-arch images (release profile: LTO, one codegen
# unit), SBOMs, provenance, cosign signatures, and the Compose bundle with image digests.
# Run with dry_run=true to build everything without pushing; dry runs skip the SBOM and
# provenance attestations.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not push or publish
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && version="0.0.0-dryrun.${GITHUB_SHA::8}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name == 'push' || inputs.dry_run == false }}" >> "$GITHUB_OUTPUT"

  images:
    needs: meta
    uses: ./.github/workflows/images.yml
    with:
      tags: ${{ needs.meta.outputs.version }}
      push: ${{ needs.meta.outputs.push == 'true' }}
      profile: release
      attest: ${{ needs.meta.outputs.push == 'true' }}
      arm64: true

  bundle:
    needs: [meta, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Dry runs push nothing, so the bundle keeps version tags instead of digests.
      - name: Render Compose bundle with digests
        run: |
          version="${{ needs.meta.outputs.version }}"
          if [ "${{ needs.meta.outputs.push }}" = true ]; then
            cat > digests.env <<EOF2
          allod=${{ needs.images.outputs.allod }}
          allod-ldk-server=${{ needs.images.outputs.allod-ldk-server }}
          allod-bitcoind=${{ needs.images.outputs.allod-bitcoind }}
          allod-bitcoind-proxy=${{ needs.images.outputs.allod-bitcoind-proxy }}
          allod-tor=${{ needs.images.outputs.allod-tor }}
          EOF2
            scripts/render-bundle.sh "$version" digests.env
          else
            scripts/render-bundle.sh "$version"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: allod-stack, path: dist/ }
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
