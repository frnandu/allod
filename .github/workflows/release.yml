# Release pipeline (SPEC §2.3.8): multi-arch images (release profile: LTO, one codegen
# unit), SBOMs, provenance, cosign signatures, and the Compose bundle with image digests.
# Run with dry_run=true to build everything without pushing; dry runs skip the SBOM and
# provenance attestations.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not push or publish
        type: boolean
        default: true
      rebuild:
        description: Rebuild every image, also those whose inputs did not change
        type: boolean
        default: false

# One release at a time: overlapping runs would race to move `latest` (the GitHub
# release and the image tag), and the next release compares its images against
# `latest`. A run waits for the one before it instead of cancelling it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write # the build cache on GHCR (images.yml)

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      push: ${{ steps.meta.outputs.push }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && version="0.0.0-dryrun.${GITHUB_SHA::8}"
          push=${{ github.event_name == 'push' || inputs.dry_run == false }}
          # `latest` marks the newest stable release; the next release compares its images
          # against it and reuses the unchanged ones (images.yml). Pre-releases never move it,
          # and neither does a release older than the newest stable tag (a fix pushed for an
          # earlier line, or a re-run).
          tags="$version" latest=false
          newest=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'v*' \
            | sed 's|.*refs/tags/v||' | grep -v -e - | sort -V | tail -n1)
          case "$version" in
            *-*) ;;
            *) if [ "$push" = true ] && [ "$(printf '%s\n%s\n' "$version" "$newest" | sort -V | tail -n1)" = "$version" ]; then
                 tags="$tags latest" latest=true
               fi ;;
          esac
          echo "newest stable tag: v${newest:-none}; this release moves latest: $latest"
          { echo "version=$version"; echo "tags=$tags"; echo "push=$push"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

  images:
    needs: meta
    uses: ./.github/workflows/images.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tags: ${{ needs.meta.outputs.tags }}
      previous: latest
      push: ${{ needs.meta.outputs.push == 'true' }}
      profile: release
      attest: ${{ needs.meta.outputs.push == 'true' }}
      arm64: true
      # Images whose inputs did not change are reused (images.yml); a tag push has no inputs.
      rebuild: ${{ inputs.rebuild == true }}

  # Appliance images (ISO, Raspberry Pi) are not part of a release run: start the
  # Appliance images workflow by hand with this version and release v<version>.

  bundle:
    needs: [meta, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Dry runs push nothing, so the bundle keeps version tags instead of digests.
      - name: Render Compose bundle with digests
        run: |
          version="${{ needs.meta.outputs.version }}"
          if [ "${{ needs.meta.outputs.push }}" = true ]; then
            cat > digests.env <<EOF2
          allod=${{ needs.images.outputs.allod }}
          allod-ldk-server=${{ needs.images.outputs.allod-ldk-server }}
          allod-bitcoind=${{ needs.images.outputs.allod-bitcoind }}
          allod-gossip=${{ needs.images.outputs.allod-gossip }}
          allod-tor=${{ needs.images.outputs.allod-tor }}
          allod-tunnel=${{ needs.images.outputs.allod-tunnel }}
          EOF2
            scripts/render-bundle.sh "$version" digests.env
          else
            scripts/render-bundle.sh "$version"
          fi
      - uses: actions/upload-artifact@v7
        with: { name: allod-stack, path: dist/ }
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          make_latest: ${{ needs.meta.outputs.latest }}
