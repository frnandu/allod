# Release pipeline (SPEC §2.3.8): multi-arch images, SBOMs, cosign signatures,
# and the Compose bundle with image digests. Run with dry_run=true to build
# everything without pushing.
#
# Each image is built natively per architecture (arm64 on GitHub's arm runners, no QEMU),
# pushed by digest, then merged into one multi-arch manifest that is tagged and signed.
# ldk-server is only rebuilt when its pin (LDK_SERVER_REV) changes: every build is also
# tagged `ldk-<rev>`, and a later release reuses that manifest when it already exists.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not push or publish
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.meta.outputs.push }}
      ldk_rev: ${{ steps.meta.outputs.ldk_rev }}
      ldk_cached: ${{ steps.ldk.outputs.cached }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && version="0.0.0-dryrun.${GITHUB_SHA::8}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name == 'push' || inputs.dry_run == false }}" >> "$GITHUB_OUTPUT"
          rev=$(sed -n 's/^ARG LDK_SERVER_REV=//p' images/ldk-server.Dockerfile)
          [ -n "$rev" ] || { echo "LDK_SERVER_REV not found in images/ldk-server.Dockerfile" >&2; exit 1; }
          echo "ldk_rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: ldk
        run: |
          if docker buildx imagetools inspect "$REGISTRY/allod-ldk-server:ldk-${{ steps.meta.outputs.ldk_rev }}" >/dev/null 2>&1; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi
      - id: matrix
        run: |
          images='[
            {"name": "allod", "dockerfile": "images/allod.Dockerfile", "target": "allod"},
            {"name": "allod-ldk-server", "dockerfile": "images/ldk-server.Dockerfile", "target": ""},
            {"name": "allod-bitcoind", "dockerfile": "images/bitcoind.Dockerfile", "target": ""},
            {"name": "allod-tor", "dockerfile": "images/tor.Dockerfile", "target": ""}
          ]'
          if [ "${{ steps.ldk.outputs.cached }}" = true ]; then
            images=$(jq 'map(select(.name != "allod-ldk-server"))' <<<"$images")
          fi
          matrix=$(jq -c '{include: [.[] as $i
            | ({platform: "linux/amd64", arch: "amd64", runner: "ubuntu-24.04"},
               {platform: "linux/arm64", arch: "arm64", runner: "ubuntu-24.04-arm"})
            | $i + .]}' <<<"$images")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: build (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=${{ needs.meta.outputs.push }}
          provenance: mode=max
          sbom: true
          # Release-only scopes: the regtest CI (deploy/compose.ci.yaml) builds other
          # profiles under its own scopes, which must not overwrite these.
          cache-from: type=gha,scope=release-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}-${{ matrix.arch }}
      - if: needs.meta.outputs.push == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - if: needs.meta.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    if: needs.meta.outputs.push == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        name: [allod, allod-ldk-server, allod-bitcoind, allod-tor]
    outputs:
      allod: ${{ steps.out.outputs.allod }}
      allod-ldk-server: ${{ steps.out.outputs.allod-ldk-server }}
      allod-bitcoind: ${{ steps.out.outputs.allod-bitcoind }}
      allod-tor: ${{ steps.out.outputs.allod-tor }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      VERSION: ${{ needs.meta.outputs.version }}
      LDK_REV: ${{ needs.meta.outputs.ldk_rev }}
      REUSE_LDK: ${{ matrix.name == 'allod-ldk-server' && needs.meta.outputs.ldk_cached == 'true' }}
    steps:
      - if: env.REUSE_LDK != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: manifest
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "$REUSE_LDK" = true ]; then
            sources=("$IMAGE:ldk-$LDK_REV")
          else
            [ "${{ matrix.name }}" = allod-ldk-server ] && tags+=(-t "$IMAGE:ldk-$LDK_REV")
            sources=()
            for f in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$f")"); done
            [ "${#sources[@]}" -eq 2 ] || { echo "expected 2 platform digests, got ${#sources[@]}" >&2; exit 1; }
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "$IMAGE@${{ steps.manifest.outputs.digest }}"
      - id: out
        run: echo "${{ matrix.name }}=$IMAGE@${{ steps.manifest.outputs.digest }}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: [meta, build, merge]
    # merge is skipped on dry runs; the bundle then keeps version tags instead of digests.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose bundle with digests
        run: |
          version="${{ needs.meta.outputs.version }}"
          if [ "${{ needs.meta.outputs.push }}" = true ]; then
            cat > digests.env <<EOF2
          allod=${{ needs.merge.outputs.allod }}
          allod-ldk-server=${{ needs.merge.outputs.allod-ldk-server }}
          allod-bitcoind=${{ needs.merge.outputs.allod-bitcoind }}
          allod-tor=${{ needs.merge.outputs.allod-tor }}
          EOF2
            scripts/render-bundle.sh "$version" digests.env
          else
            scripts/render-bundle.sh "$version"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: allod-stack, path: dist/ }
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
